<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>คำถามหัวใจ 💗</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box
}

html,body{
width:100%;
height:100%;
overflow:hidden
}

body{
font-family:Arial,"Noto Sans Thai",sans-serif;
background:linear-gradient(
135deg,
#ffd6e7,
#ffc0da,
#e8b5df,
#c9b9ed,
#f8c9d9
);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
display:flex;
align-items:center;
justify-content:center;
color:#8c3159
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

body:before,
body:after{
content:"";
position:absolute;
border-radius:50%;
filter:blur(75px);
opacity:.4;
pointer-events:none
}

body:before{
width:300px;
height:300px;
background:#ff8fb8;
top:-100px;
left:-80px;
animation:light 8s ease-in-out infinite
}

body:after{
width:330px;
height:330px;
background:#bba1ed;
right:-100px;
bottom:-100px;
animation:light 10s ease-in-out infinite reverse
}

@keyframes light{
0%,100%{transform:translate(0,0)}
50%{transform:translate(40px,-30px)}
}

/* หัวใจลอย */
.float{
position:absolute;
color:rgba(255,255,255,.65);
z-index:1;
animation:float 7s ease-in-out infinite;
pointer-events:none
}

.f1{left:7%;top:15%;font-size:25px}
.f2{left:18%;top:72%;font-size:18px;animation-delay:1s}
.f3{left:30%;top:10%;font-size:20px;animation-delay:2s}
.f4{left:8%;top:48%;font-size:14px;animation-delay:3s}
.f5{left:43%;top:82%;font-size:22px;animation-delay:1.5s}
.f6{right:8%;top:20%;font-size:30px;animation-delay:2s}
.f7{right:18%;top:70%;font-size:19px;animation-delay:3s}
.f8{right:32%;top:11%;font-size:15px;animation-delay:1s}
.f9{right:7%;top:50%;font-size:22px;animation-delay:2.5s}
.f10{right:43%;bottom:9%;font-size:17px;animation-delay:4s}

@keyframes float{
0%,100%{transform:translateY(0) rotate(-8deg)}
50%{transform:translateY(-28px) rotate(8deg)}
}

/* หน้าแรก */
.home{
position:relative;
z-index:5;
width:min(90%,460px);
padding:45px 28px 40px;
text-align:center;
border:1px solid rgba(255,255,255,.8);
border-radius:38px;
background:rgba(255,255,255,.28);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
box-shadow:
0 25px 70px rgba(126,40,88,.22),
inset 0 1px 0 rgba(255,255,255,.8);
animation:appear .8s ease
}

@keyframes appear{
from{
opacity:0;
transform:translateY(25px) scale(.95)
}
to{
opacity:1;
transform:translateY(0) scale(1)
}
}

/* หัวใจกลาง */
.heart-area{
position:relative;
width:190px;
height:175px;
margin:0 auto 10px;
display:flex;
align-items:center;
justify-content:center
}

.glow{
position:absolute;
width:140px;
height:140px;
border-radius:50%;
background:rgba(255,85,150,.3);
filter:blur(25px);
animation:glow 2.5s ease-in-out infinite
}

@keyframes glow{
0%,100%{transform:scale(.85);opacity:.4}
50%{transform:scale(1.2);opacity:.8}
}

.heart{
position:relative;
width:105px;
height:105px;
background:linear-gradient(135deg,#ff76a7,#ed407b,#d62f6c);
transform:rotate(-45deg);
border-radius:18px;
box-shadow:
0 18px 35px rgba(198,40,93,.35),
inset 8px 8px 15px rgba(255,255,255,.25);
animation:beat 2.2s ease-in-out infinite;
z-index:2
}

.heart:before,
.heart:after{
content:"";
position:absolute;
width:105px;
height:105px;
background:inherit;
border-radius:50%
}

.heart:before{
top:-52px;
left:0
}

.heart:after{
left:52px;
top:0
}

@keyframes beat{
0%,100%{transform:rotate(-45deg) scale(1)}
50%{transform:rotate(-45deg) scale(1.12)}
}

.heart-symbol{
position:absolute;
z-index:4;
font-size:35px;
color:#fff;
animation:pulse 1.5s ease-in-out infinite
}

@keyframes pulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.2)}
}

.title{
font-size:29px;
font-weight:800;
color:#8b2c55;
margin-bottom:10px
}

.subtitle{
font-size:15px;
line-height:1.8;
color:#9d456b;
margin-bottom:28px
}

.start,
.next{
border:0;
cursor:pointer;
padding:16px 30px;
border-radius:50px;
font-family:inherit;
font-size:17px;
font-weight:700;
color:white;
background:linear-gradient(135deg,#ff76a7,#ed4d88,#d93876);
box-shadow:0 10px 25px rgba(205,45,103,.3);
transition:.25s
}

.start:hover,
.next:hover{
transform:translateY(-4px) scale(1.03);
box-shadow:0 15px 35px rgba(205,45,103,.4)
}

/* หน้าแบบสอบถาม */
.quiz{
display:none;
position:fixed;
inset:0;
z-index:20;
align-items:center;
justify-content:center;
padding:20px;
background:linear-gradient(
135deg,
#ffd8e8,
#f4b8d4,
#d8c1ed
);
background-size:400% 400%;
animation:bgMove 12s ease infinite
}

.quiz-box{
width:min(92%,520px);
padding:35px 28px;
border-radius:32px;
text-align:center;
background:rgba(255,255,255,.82);
border:1px solid rgba(255,255,255,.9);
box-shadow:0 25px 70px rgba(112,45,94,.2);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);
animation:appear .6s ease
}

/* แถบความคืบหน้า */
.progress-text{
font-size:14px;
font-weight:bold;
color:#b15378;
margin-bottom:8px
}

.progress{
height:9px;
width:100%;
background:#f6d4e2;
border-radius:20px;
overflow:hidden;
margin-bottom:25px
}

.progress-bar{
height:100%;
width:20%;
border-radius:20px;
background:linear-gradient(90deg,#ff7eaa,#e8447d);
transition:.4s ease
}

.quiz-heart{
font-size:45px;
margin-bottom:5px;
animation:pulse 1.5s ease-in-out infinite
}

.question{
font-size:21px;
line-height:1.6;
font-weight:700;
color:#8d3158;
min-height:70px;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:22px
}

/* ปุ่มถูกผิด */
.answers{
display:flex;
gap:15px;
justify-content:center;
margin-bottom:22px
}

.answer-btn{
flex:1;
max-width:180px;
padding:15px 10px;
border:2px solid transparent;
border-radius:20px;
font-family:inherit;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.25s
}

.correct{
background:#ffe1ec;
color:#d83f73;
border-color:#f4a6c1
}

.wrong{
background:#eee2f4;
color:#8e579f;
border-color:#cdb1dc
}

.answer-btn:hover{
transform:translateY(-4px) scale(1.03);
box-shadow:0 8px 20px rgba(160,70,110,.15)
}

.answer-btn.selected{
transform:scale(.95);
box-shadow:0 0 0 4px rgba(255,255,255,.7)
}

/* ช่องพิมพ์ข้อสุดท้าย */
.text-answer{
display:none;
width:100%;
height:120px;
resize:none;
padding:15px;
border:2px solid #efa5c1;
border-radius:20px;
background:rgba(255,255,255,.75);
outline:none;
font-family:inherit;
font-size:16px;
color:#843353;
margin-bottom:18px
}

.text-answer:focus{
border-color:#e95388;
box-shadow:0 0 15px rgba(233,83,136,.2)
}

/* หน้าจบ */
.finish{
display:none;
text-align:center
}

.finish .big-heart{
font-size:65px;
animation:pulse 1.5s infinite
}

.finish h2{
font-size:27px;
color:#8d3158;
margin:12px 0
}

.finish p{
color:#a4476d;
line-height:1.8
}

@media(max-width:500px){

.home{
padding:38px 20px 35px
}

.title{
font-size:25px
}

.quiz-box{
padding:30px 20px
}

.question{
font-size:19px
}

.answer-btn{
font-size:16px
}
}
</style>
</head>

<body>

<div class="float f1">♥</div>
<div class="float f2">♡</div>
<div class="float f3">♥</div>
<div class="float f4">♡</div>
<div class="float f5">♥</div>
<div class="float f6">♡</div>
<div class="float f7">♥</div>
<div class="float f8">♡</div>
<div class="float f9">♥</div>
<div class="float f10">♡</div>

<!-- หน้าแรก -->
<main class="home" id="home">

<div class="heart-area">
<div class="glow"></div>
<div class="heart"></div>
<div class="heart-symbol">♡</div>
</div>

<h1 class="title">คำถามหัวใจ 💗</h1>

<p class="subtitle">
มีคำถามเล็ก ๆ ที่อยากให้หัวใจของคุณตอบ<br>
ตอบตามความรู้สึกจริง ๆ ของคุณนะ
</p>

<button class="start" onclick="startQuiz()">
💗 กรุณาตอบคำถามหัวใจ
</button>

</main>


<!-- แบบสอบถาม -->
<section class="quiz" id="quiz">

<div class="quiz-box">

<div id="quizContent">

<div class="progress-text">
คำถาม <span id="number">1</span> / 5
</div>

<div class="progress">
<div class="progress-bar" id="progress"></div>
</div>

<div class="quiz-heart">💌</div>

<div class="question" id="question"></div>

<div class="answers" id="buttons">

<button class="answer-btn correct" onclick="choose('ถูก')">
💗 ถูก
</button>

<button class="answer-btn wrong" onclick="choose('ผิด')">
💔 ผิด
</button>

</div>

<textarea
class="text-answer"
id="textAnswer"
placeholder="พิมพ์คำตอบของคุณตรงนี้..."
></textarea>

<button class="next" onclick="nextQuestion()">
ถัดไป 💕
</button>

</div>


<!-- หน้าจบ -->
<div class="finish" id="finish">

<div class="big-heart">💗</div>

<h2>ขอบคุณที่ตอบนะ</h2>

<p>
คำตอบของคุณถูกส่งเรียบร้อยแล้ว<br>
หวังว่าคำตอบเหล่านี้จะไปถึงหัวใจอีกดวงนะ
</p>

</div>

</div>

</section>


<script>

/* =========================================
   ใส่ URL Google Apps Script ตรงนี้
   ========================================= */

const GOOGLE_SCRIPT_URL =
"ใส่_URL_GOOGLE_APPS_SCRIPT_ตรงนี้";


/* คำถาม */
const questions = [

"ถ้าไฟครบ100แล้วจะคุยด้วยกันไหม",

"ยังมีใจให้กันอยู่รึป่าว",

"รู้ไหมว่าคนทำรอให้ครบ100วันตั้งนาน",

"มีสาวใหม่ยัง",

"บล็อกเราทำไม?"

];


let current = 0;
let selectedAnswer = "";


/* เริ่ม */
function startQuiz(){

document.getElementById("home").style.display="none";

document.getElementById("quiz").style.display="flex";

showQuestion();

}


/* แสดงคำถาม */
function showQuestion(){

document.getElementById("question").textContent =
questions[current];

document.getElementById("number").textContent =
current + 1;

document.getElementById("progress").style.width =
((current + 1) / questions.length * 100) + "%";

selectedAnswer = "";

document.querySelectorAll(".answer-btn").forEach(btn=>{
btn.classList.remove("selected");
});


/* ข้อสุดท้ายเป็นช่องพิมพ์ */
if(current === questions.length - 1){

document.getElementById("buttons").style.display="none";

document.getElementById("textAnswer").style.display="block";

}else{

document.getElementById("buttons").style.display="flex";

document.getElementById("textAnswer").style.display="none";

}

}


/* เลือกถูก / ผิด */
function choose(answer){

selectedAnswer = answer;

document.querySelectorAll(".answer-btn").forEach(btn=>{
btn.classList.remove("selected");
});

event.target.classList.add("selected");

}


/* ถัดไป */
function nextQuestion(){

let answer = "";


/* ข้อสุดท้าย */
if(current === questions.length - 1){

answer =
document.getElementById("textAnswer").value.trim();

if(answer === ""){

alert("หัวใจยังรอคำตอบอยู่นะ 💗");

return;

}

}else{

if(selectedAnswer === ""){

alert("เลือกคำตอบก่อนนะ 💗");

return;

}

answer = selectedAnswer;

}


/* ส่งคำตอบ */
sendAnswer(
current + 1,
questions[current],
answer
);


/* ยังมีคำถาม */
if(current < questions.length - 1){

current++;

showQuestion();

}else{

document.getElementById("quizContent").style.display="none";

document.getElementById("finish").style.display="block";

}

}


/* ส่งข้อมูลไป Google Sheets */
function sendAnswer(number,question,answer){

if(
!GOOGLE_SCRIPT_URL ||
GOOGLE_SCRIPT_URL.includes("ใส่_URL")
){
console.log({
questionNumber:number,
question:question,
answer:answer
});

return;
}

fetch(GOOGLE_SCRIPT_URL,{
method:"POST",
mode:"no-cors",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
questionNumber:number,
question:question,
answer:answer,
time:new Date().toLocaleString("th-TH")
})
});

}

</script>

</body>
</html>

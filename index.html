<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>คำถามหัวใจ 💗</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box
}
html,body{
width:100%;
height:100%;
overflow:hidden
}
body{
font-family:Arial,"Noto Sans Thai",sans-serif;
background:linear-gradient(
135deg,
#ffd6e7 0%,
#ffc1dc 25%,
#e8b4df 50%,
#c9b8ed 75%,
#f7c9d9 100%
);
background-size:300% 300%;
animation:bgMove 12s ease infinite;
display:flex;
align-items:center;
justify-content:center;
color:#8c3159
}
@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}
/* แสงพื้นหลัง */
body:before,
body:after{
content:"";
position:absolute;
border-radius:50%;
filter:blur(70px);
opacity:.35;
pointer-events:none
}
body:before{
width:280px;
height:280px;
background:#ff91b8;
top:-80px;
left:-70px;
animation:lightMove 8s ease-in-out infinite
}
body:after{
width:320px;
height:320px;
background:#b99bea;
right:-100px;
bottom:-100px;
animation:lightMove 10s ease-in-out infinite reverse
}
@keyframes lightMove{
0%,100%{transform:translate(0,0)}
50%{transform:translate(40px,-30px)}
}
/* หัวใจลอย */
.float-heart{
position:absolute;
z-index:1;
color:rgba(255,255,255,.65);
font-size:28px;
filter:drop-shadow(0 5px 10px rgba(180,50,100,.15));
animation:heartFloat linear infinite;
pointer-events:none
}
.f1{left:7%;top:18%;font-size:25px;animation-duration:6s}
.f2{left:18%;top:72%;font-size:18px;animation-duration:8s}
.f3{left:31%;top:12%;font-size:20px;animation-duration:7s}
.f4{left:8%;top:48%;font-size:14px;animation-duration:9s}
.f5{left:42%;top:82%;font-size:22px;animation-duration:6.5s}
.f6{right:8%;top:20%;font-size:30px;animation-duration:7.5s}
.f7{right:18%;top:70%;font-size:19px;animation-duration:8.5s}
.f8{right:32%;top:10%;font-size:15px;animation-duration:6s}
.f9{right:7%;top:50%;font-size:22px;animation-duration:9s}
.f10{right:43%;bottom:9%;font-size:17px;animation-duration:7s}
@keyframes heartFloat{
0%{
transform:translateY(30px) rotate(-10deg);
opacity:.25
}
25%{
transform:translate(15px,-15px) rotate(8deg);
opacity:.8
}
50%{
transform:translate(-10px,-40px) rotate(-5deg);
opacity:.65
}
75%{
transform:translate(12px,-20px) rotate(10deg);
opacity:.85
}
100%{
transform:translateY(30px) rotate(-10deg);
opacity:.25
}
}
/* กล่องหลัก */
.main{
position:relative;
z-index:5;
width:min(90%,460px);
padding:45px 28px 40px;
text-align:center;
border:1px solid rgba(255,255,255,.75);
border-radius:38px;
background:rgba(255,255,255,.28);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
box-shadow:
0 25px 70px rgba(126,40,88,.22),
inset 0 1px 0 rgba(255,255,255,.7);
animation:boxIn 1s ease
}
@keyframes boxIn{
from{
opacity:0;
transform:translateY(25px) scale(.95)
}
to{
opacity:1;
transform:translateY(0) scale(1)
}
}
/* วงแสงรอบหัวใจ */
.heart-area{
position:relative;
width:200px;
height:190px;
margin:0 auto 8px;
display:flex;
align-items:center;
justify-content:center
}
.glow{
position:absolute;
width:145px;
height:145px;
border-radius:50%;
background:rgba(255,103,158,.3);
filter:blur(25px);
animation:glowPulse 2.5s ease-in-out infinite
}
@keyframes glowPulse{
0%,100%{
transform:scale(.85);
opacity:.45
}
50%{
transform:scale(1.15);
opacity:.8
}
}
/* หัวใจหลัก */
.heart{
position:relative;
width:105px;
height:105px;
background:linear-gradient(
135deg,
#ff6f9f,
#ef407c,
#d82f6c
);
transform:rotate(-45deg);
border-radius:18px;
box-shadow:
0 18px 35px rgba(198,40,93,.35),
inset 8px 8px 15px rgba(255,255,255,.25);
animation:mainHeart 2.2s ease-in-out infinite;
z-index:2
}
.heart:before,
.heart:after{
content:"";
position:absolute;
width:105px;
height:105px;
background:inherit;
border-radius:50%
}
.heart:before{
top:-52px;
left:0
}
.heart:after{
top:0;
left:52px
}
@keyframes mainHeart{
0%,100%{
transform:rotate(-45deg) scale(1)
}
50%{
transform:rotate(-45deg) scale(1.12)
}
}
.heart-symbol{
position:absolute;
z-index:4;
font-size:35px;
color:white;
text-shadow:0 3px 10px rgba(170,20,70,.25);
animation:symbolPulse 1.5s ease-in-out infinite
}
@keyframes symbolPulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.2)}
}
/* ข้อความ */
.title{
font-size:29px;
font-weight:800;
letter-spacing:.3px;
color:#8b2c55;
margin-top:8px;
margin-bottom:10px
}
.subtitle{
font-size:15px;
line-height:1.8;
color:#9d456b;
margin-bottom:28px
}
/* ปุ่ม */
.start{
position:relative;
border:0;
outline:0;
cursor:pointer;
padding:16px 30px;
border-radius:50px;
font-family:inherit;
font-size:17px;
font-weight:700;
color:white;
background:linear-gradient(
135deg,
#ff76a7,
#ed4d88,
#d93876
);
box-shadow:
0 10px 25px rgba(205,45,103,.3),
inset 0 1px 2px rgba(255,255,255,.4);
transition:.3s ease;
overflow:hidden
}
.start:before{
content:"";
position:absolute;
top:0;
left:-100%;
width:70%;
height:100%;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.45),
transparent
);
transform:skewX(-20deg);
transition:.6s
}
.start:hover{
transform:translateY(-4px) scale(1.04);
box-shadow:
0 15px 35px rgba(205,45,103,.4)
}
.start:hover:before{
left:140%
}
.start:active{
transform:scale(.96)
}
/* คำถาม */
.quiz{
display:none;
position:fixed;
inset:0;
z-index:20;
align-items:center;
justify-content:center;
padding:20px;
background:linear-gradient(
135deg,
#ffd8e8,
#f4b8d4,
#d8c1ed
);
background-size:300% 300%;
animation:bgMove 12s ease infinite
}
.quiz-box{
width:min(92%,500px);
padding:38px 28px;
border-radius:32px;
text-align:center;
background:rgba(255,255,255,.8);
border:1px solid rgba(255,255,255,.9);
box-shadow:0 25px 70px rgba(112,45,94,.2);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);
animation:boxIn .6s ease
}
.quiz-heart{
font-size:50px;
margin-bottom:10px;
animation:symbolPulse 1.5s ease-in-out infinite
}
.quiz-box h2{
font-size:25px;
color:#8d3158;
margin-bottom:12px
}
.quiz-box p{
font-size:16px;
line-height:1.7;
color:#9d456b;
margin-bottom:22px
}
.answer{
width:100%;
padding:14px 18px;
border:2px solid #f1a1c0;
border-radius:18px;
background:rgba(255,255,255,.8);
outline:none;
font-family:inherit;
font-size:16px;
text-align:center;
color:#863052;
margin-bottom:15px;
transition:.25s
}
.answer:focus{
border-color:#ed5d91;
box-shadow:0 0 18px rgba(237,93,145,.2)
}
.submit{
border:0;
padding:13px 30px;
border-radius:30px;
background:linear-gradient(135deg,#ff6f9f,#df3d76);
color:white;
font-family:inherit;
font-size:16px;
font-weight:bold;
cursor:pointer;
box-shadow:0 8px 20px rgba(210,45,101,.25);
transition:.25s
}
.submit:hover{
transform:translateY(-3px)
}
@media(max-width:500px){
.main{
padding:38px 20px 35px
}
.title{
font-size:25px
}
.subtitle{
font-size:14px
}
.heart-area{
transform:scale(.9);
margin-top:-8px;
margin-bottom:-5px
}
}
</style>
</head>
<body>
<!-- หัวใจตกแต่ง -->
<div class="float-heart f1">♥</div>
<div class="float-heart f2">♡</div>
<div class="float-heart f3">♥</div>
<div class="float-heart f4">♡</div>
<div class="float-heart f5">♥</div>
<div class="float-heart f6">♡</div>
<div class="float-heart f7">♥</div>
<div class="float-heart f8">♡</div>
<div class="float-heart f9">♥</div>
<div class="float-heart f10">♡</div>
<!-- หน้าแรก -->
<main class="main" id="home">
<div class="heart-area">
<div class="glow"></div>
<div class="heart"></div>
<div class="heart-symbol">♡</div>
</div>
<h1 class="title">คำถามหัวใจ 💗</h1>
<p class="subtitle">
มีคำถามเล็ก ๆ ที่อยากให้คุณตอบ<br>
ตอบตามความรู้สึกของหัวใจได้เลยนะ
</p>
<button class="start" onclick="startQuiz()">
💗 กรุณาตอบคำถามหัวใจ
</button>
</main>
<!-- หน้าคำถาม -->
<section class="quiz" id="quiz">
<div class="quiz-box">
<div class="quiz-heart">💌</div>
<h2>คำถามหัวใจ</h2>
<p>
คำถามที่ 1<br>
วันนี้หัวใจของคุณกำลังรู้สึกอย่างไร?
</p>
<input
class="answer"
id="answer"
type="text"
placeholder="พิมพ์คำตอบของคุณ..."
>
<br>
<button class="submit" onclick="submitAnswer()">
ส่งคำตอบ 💗
</button>
</div>
</section>
<script>
function startQuiz(){
document.getElementById("home").style.display="none";
document.getElementById("quiz").style.display="flex";
}
function submitAnswer(){
const answer=document.getElementById("answer").value.trim();
if(answer===""){
alert("หัวใจรอคำตอบอยู่นะ 💗");
return;
}
alert("ได้รับคำตอบแล้วนะ 💕\nขอบคุณที่เปิดใจตอบคำถาม");
}
</script>
</body>
</html>
